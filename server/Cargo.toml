[package]
name = "own-sync-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
