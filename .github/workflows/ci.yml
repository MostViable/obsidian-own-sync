name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path server/Cargo.toml
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo build --locked --manifest-path server/Cargo.toml
      - run: bash scripts/server-smoke.sh server/target/debug/own-sync-server
